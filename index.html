<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đảo Đèn Lồng · Ba Đêm</title><link rel="stylesheet" href="style.css"></head>
<body>
<canvas id="game" aria-label="Game 3D Đảo Đèn Lồng"></canvas>
<header><div><div class="brand">ĐẢO ĐÈN LỒNG</div><span id="night"></span><div id="flames" aria-label="Ngọn Lửa"></div></div><time id="timer">5:00</time><div class="right"><div id="progress"></div><div id="score"></div><button id="pause">Tạm dừng</button></div></header>
<div id="notice" role="status" aria-live="polite"></div>
<div id="guide" hidden aria-label="Hướng đèn gần nhất"></div>
<div class="inventory"><div id="carry" aria-label="Đom đóm đang mang"></div><span id="carry-label"></span></div><div id="cooldowns"></div>
<footer><span><kbd>W A S D</kbd> Đi</span><span><kbd>Space</kbd> Nhảy</span><span><kbd>Shift</kbd> Lướt</span><span><kbd>E</kbd> Nạp</span><span><kbd>F</kbd> Tỏa sáng (3)</span><span><kbd>← →</kbd> / kéo chuột: camera</span><span><kbd>Esc / P</kbd> Dừng</span></footer>
<div class="veil" id="overlay"><section><div class="eyebrow">BA ĐÊM GIỮ LỬA</div><h1 id="overlay-title">Đảo Đèn Lồng</h1><p id="overlay-text"></p><div id="settings" hidden><label>Âm lượng<input id="volume" type="range" min="0" max="1" step="0.05"></label><label>Độ nhạy chuột<input id="sensitivity" type="range" min="0.1" max="3" step="0.1"></label><label>Bảng màu dễ phân biệt<input id="colorblind" type="checkbox"></label></div><div id="actions"></div><p class="hint">Thắp mới 10 · Thắp lại 5 · Giữ đủ đèn tới bình minh</p></section></div>
<script type="module" src="src/web.mjs"></script>
</body></html>
